<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <h1>Cadastro</h1>
        <form id="cadastroForm">
            <input type="text" id="nome" placeholder="Nome completo">
            <input type="email" id="email" placeholder="E-mail">
            <input type="text" id="novoUsuario" placeholder="Usuário">
            <input type="password" id="novaSenha" placeholder="Senha">
            <input type="password" id="confirmaSenha" placeholder="Confirmar senha">
            <button type="submit">Cadastrar</button>
            <p id="mensagem"></p>
        </form>
        <a href="index.html" class="link">Voltar ao login</a>
    </div>
    <script src="cadastro.js"></script>
</body>

</html>
